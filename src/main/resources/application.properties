spring.application.name=ajax

# server config
server.port=80
server.servlet.context-path=/

# view config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# db config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ajax
spring.datasource.username=root
spring.datasource.password=java1234

# mybatis mapper 등록 (❗ 꼭 필요함)
mybatis.mapper-locations=classpath:mapper/*.xml


# log config
logging.level.com.example.ajax.controller=info
logging.level.com.example.ajax.service=info
logging.level.com.example.ajax.mapper=info
